<!DOCTYPE html>
<html lang="fr">
<head>
  <!--
    Remplacé par la valeur de `--base-href` lors de `flutter build web`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="ROSE Connect : comprendre le cancer du sein, reconnaître les signes et savoir quand consulter.">
  <meta name="theme-color" content="#F8F7F4">

  <!-- iPhone : ajout à l'écran d'accueil, plein écran -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ROSE Connect">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ROSE Connect</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Même fond que l'application : pas de flash blanc au chargement. */
    html, body { margin: 0; height: 100%; background: #F8F7F4; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
